# Deploy automático para o GitHub Pages.
#
# NÃO está em .github/workflows/ porque o token usado para criar este
# repositório não tinha o escopo `workflow` — o GitHub recusa o push. Para
# ativar:
#
#     gh auth refresh -s workflow
#     mkdir -p .github/workflows && git mv docs/deploy-workflow.yml .github/workflows/deploy.yml
#     git commit -m "Adiciona deploy automático" && git push
#
# Depois troque a fonte do Pages para GitHub Actions em Settings -> Pages.
# Até lá a publicação é manual — veja "Publicação" no README.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `prebuild` regenerates public/programs/_opt (gitignored: derived files).
      - name: Build static export
        env:
          # Project sites are served from /<repo>/, so every asset and link
          # needs the prefix and every canonical needs the full URL.
          NEXT_PUBLIC_BASE_PATH: /site-work-up-fit
          NEXT_PUBLIC_SITE_URL: https://goodjenian.github.io/site-work-up-fit
        run: npm run build

      # Pages serves _next/* only when Jekyll is disabled.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
